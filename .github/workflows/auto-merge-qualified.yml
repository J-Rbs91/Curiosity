name: Auto-merge qualified PRs

# Exécution depuis main uniquement. Ne jamais exécuter le code d'une PR.
on:
  workflow_run:
    workflows: ["ci", "Secret scan"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: auto-merge-qualified-prs
  cancel-in-progress: false

jobs:
  merge:
    name: merge qualified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Vérifier GitHub et fusionner les PR qualifiées
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/auto-merge-prs.mjs
