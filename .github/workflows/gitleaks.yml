name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Le scan remonte tout l'historique (`fetch-depth: 0`) : le laisser tourner sur un commit
# déjà remplacé coûte cher pour un verdict que plus personne ne lira. Sur main on ne coupe
# rien — aucun état de main ne doit passer sans avoir été scanné.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
