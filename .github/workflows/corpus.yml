name: corpus

# Le contrôle documentaire ne peut pas dépendre de la discipline d'un agent ni de celle
# d'un contributeur : il tourne ici, sur chaque changement touchant le corpus ou sa
# projection. Voir docs/corpus-workflow.md.

on:
  push:
    branches: ["**"]
    paths:
      - "corpus/**"
      - "scripts/corpus/**"
      - "scripts/mcp/**"
      - "src/content/**"
      - "src/types/**"
      - ".github/workflows/corpus.yml"
  pull_request:
    paths:
      - "corpus/**"
      - "scripts/corpus/**"
      - "scripts/mcp/**"
      - "src/content/**"
      - "src/types/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Valider le corpus maître
        run: npm run corpus:validate
      - name: Vérifier que la projection est à jour
        # Une projection divergente signifie qu'un fichier généré a été édité à la main,
        # ou qu'une fiche a changé sans être reprojetée.
        run: |
          npm run corpus:build
          git diff --exit-code src/content/generated/
      - run: npm test
      - run: npm run lint
