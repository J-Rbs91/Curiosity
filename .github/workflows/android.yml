name: Android

on:
  pull_request:
    paths:
      - "native/**"
      - "src/domain/reminder/**"
      - "src/lib/daily-discovery.ts"
      - "src/lib/daily-discovery.test.ts"
      - "src/app/settings/page.tsx"
      - "package.json"
      - "eslint.config.mjs"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Le package historique `tools` n'existe plus. L'action l'inclut dans
          # sa valeur par défaut, donc on limite explicitement l'installation.
          packages: platform-tools

      - name: Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm ci

      - name: Install native dependencies
        run: npm install --prefix native

      - name: Web tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Generate Android project
        run: npm run android:sync

      - name: Native tests and debug APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: curiosity-android-debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
