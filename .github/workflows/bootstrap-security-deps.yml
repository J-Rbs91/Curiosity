name: Bootstrap security dependency update

on:
  push:
    branches:
      - chore/security-deps-2026-09
    paths:
      - .github/workflows/bootstrap-security-deps.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/security-deps-2026-09

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Update direct security-sensitive dependencies
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.dependencies.next = '16.3.3';
          p.devDependencies['eslint-config-next'] = '16.3.3';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --package-lock-only
          npm update --package-lock-only --save=false js-yaml sharp

      - name: Assert expected versions
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const expected = {
            'node_modules/next': '16.3.3',
            'node_modules/eslint-config-next': '16.3.3',
            'node_modules/js-yaml': '4.3.2',
            'node_modules/sharp': '0.35.4',
            'node_modules/vitest': '4.1.10',
          };
          for (const [key, version] of Object.entries(expected)) {
            const actual = lock.packages?.[key]?.version;
            if (actual !== version) throw new Error(`${key}: expected ${version}, got ${actual}`);
          }
          NODE

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(deps): apply security dependency updates"
          git push origin HEAD:chore/security-deps-2026-09
